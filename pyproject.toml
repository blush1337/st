[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-region-translator"
version = "0.1.0"
description = "A Windows tray utility for translating text in a selected screen region"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "mss>=9,<11",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "pynput>=1.7,<2",
  "rapidocr-onnxruntime>=1.4,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.gui-scripts]
screen-region-translator = "screen_translator.main:main"

[tool.setuptools.packages.find]
include = ["screen_translator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

